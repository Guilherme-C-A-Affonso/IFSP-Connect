<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
    <h1>Cadastro de Usuários</h1>
    <form>
        <p>
            <label>Nome Completo:</label>
            <input type="text" placeholder="Digite seu nome">
        </p>
        <p>
            <label>E-mail institucional:</label>
            <input type="email" placeholder="Digite seu email">
        </p>
        <p>
            <label>Senha:</label>
            <input type="password" placeholder="Digite sua senha">
        </p>
        <p>
            <label>Curso:</label>
            <input type="text" placeholder="Digite seu curso">
        </p>
        <p>
            <label>Selecione seu turno:</label>
            <br>
            <input type="radio" name="turno">Manhã
            <br>
            <input type="radio" name="turno">Tarde
            <br>
            <input type="radio" name="turno">Noite
        </p>
        <p>
            <label>Selecione seus interesses:</label>
            <br>
            <input type="checkbox">Tecnologia
            <br>
            <input type="checkbox">Programação
            <br>
            <input type="checkbox">Matemática
            <br>
            <input type="checkbox">Eletrônica
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
    <div class="btn-voltar">
        <a href="\index.html">Voltar</a>
    </div>
</body>
</html>
